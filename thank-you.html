<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thanks — Zip Electrical Services</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #12181F;
    --cream: #F6F4EF;
    --amber: #F5B400;
    --slate: #5B6470;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
  }
  .box { max-width: 480px; }
  .check {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--amber);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 24px;
  }
  h1 {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 2rem;
    margin-bottom: 14px;
  }
  p { color: var(--slate); font-size: 1.05rem; margin-bottom: 28px; }
  a {
    display: inline-block;
    background: var(--ink);
    color: var(--cream);
    padding: 13px 26px;
    border-radius: 3px;
    text-decoration: none;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="check">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#12181F" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <h1>Got it, thanks!</h1>
    <p>Your job request has come through. I'll get back to you within 24 hours — for anything urgent, feel free to call 0413 432 850 directly.</p>
    <a href="/">Back to site</a>
  </div>
</body>
</html>
